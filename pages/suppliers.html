<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Management | StockFlow</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <!-- Shared Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="lg:pl-64 flex flex-col min-h-screen">

        <!-- Shared Dynamic Topbar -->
        <div id="topbar-container"></div>

        <!-- Page Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- Page Header & Action Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                    <div class="flex items-center gap-2">
                        <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Suppliers & Vendors</h2>
                        <span id="suppliers-count" class="px-2 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">0</span>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Manage vendor relationships, contact directories, and procurement sources.</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" id="export-suppliers-csv" class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">
                        <i data-lucide="download" class="w-4 h-4 text-slate-500"></i>
                        <span>Export CSV</span>
                    </button>
                    <button type="button" onclick="SuppliersModule.openAddModal()" class="inline-flex items-center gap-2 px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Add Supplier</span>
                    </button>
                </div>
            </div>

            <!-- Search Toolbar -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div class="relative w-full max-w-md">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="supplier-search" placeholder="Search by name, company, phone or email..." class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>
                <div class="text-xs text-slate-400 hidden sm:block">
                    Procurement partners directory
                </div>
            </div>

            <!-- Suppliers Data Table -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 font-semibold text-[11px] uppercase tracking-wider border-b border-slate-200">
                                <th class="px-4 py-3">Supplier ID</th>
                                <th class="px-4 py-3">Supplier Name</th>
                                <th class="px-4 py-3">Company</th>
                                <th class="px-4 py-3">Phone</th>
                                <th class="px-4 py-3">Email</th>
                                <th class="px-4 py-3 text-center">Products Supplied</th>
                                <th class="px-4 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="suppliers-table-body" class="divide-y divide-slate-100">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL: Add / Edit Supplier -->
    <div id="supplier-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-container bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 id="supplier-modal-title" class="text-base font-bold text-slate-900">Add Supplier</h3>
                <button type="button" onclick="Utils.closeModal('supplier-modal')" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="supplier-form" class="p-6 space-y-4 text-xs">
                <input type="hidden" id="supplier-modal-id">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block font-semibold text-slate-700 mb-1" for="sup-name">Supplier Contact / Name *</label>
                        <input type="text" id="sup-name" required placeholder="e.g. Ramesh Chandra / Techtronics" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="sup-company">Company / Legal Name</label>
                        <input type="text" id="sup-company" placeholder="e.g. Techtronics India Pvt Ltd" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="sup-phone">Phone Number</label>
                        <input type="text" id="sup-phone" placeholder="e.g. +91 98765 43210" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 font-mono">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block font-semibold text-slate-700 mb-1" for="sup-email">Email Address</label>
                        <input type="email" id="sup-email" placeholder="e.g. sales@vendor.com" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block font-semibold text-slate-700 mb-1" for="sup-address">Warehouse / Office Address</label>
                        <textarea id="sup-address" rows="2" placeholder="Street, Industrial Area, City, State, PIN..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"></textarea>
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block font-semibold text-slate-700 mb-1" for="sup-notes">Notes / Payment Terms</label>
                        <textarea id="sup-notes" rows="2" placeholder="Net 30, authorized distributor, discount terms..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"></textarea>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                    <button type="button" onclick="Utils.closeModal('supplier-modal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">
                        Save Supplier
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: View Supplier Details -->
    <div id="view-supplier-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-container bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 class="text-base font-bold text-slate-900">Supplier Dossier</h3>
                <button type="button" onclick="Utils.closeModal('view-supplier-modal')" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto" id="view-supplier-content">
                <!-- Injected dynamically -->
            </div>
            <div class="px-6 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
                <button type="button" onclick="Utils.closeModal('view-supplier-modal')" class="px-4 py-2 text-xs font-semibold bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/suppliers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init('Supplier Management', ['Directory', 'Suppliers']);
            SuppliersModule.init();
        });
    </script>
</body>
</html>
