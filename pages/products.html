<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management | StockFlow</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <!-- Shared Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="lg:pl-64 flex flex-col min-h-screen">

        <!-- Shared Dynamic Topbar -->
        <div id="topbar-container"></div>

        <!-- Page Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

            <!-- Page Header & Action Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                    <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Product Catalog</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Manage inventory items, pricing, SKUs, and stock reorder thresholds.</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" id="export-products-csv" class="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">
                        <i data-lucide="download" class="w-4 h-4 text-slate-500"></i>
                        <span>Export CSV</span>
                    </button>
                    <button type="button" onclick="ProductsModule.openAddModal()" class="inline-flex items-center gap-2 px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Add Product</span>
                    </button>
                </div>
            </div>

            <!-- Filters & Search Toolbar -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">

                    <!-- Search Input -->
                    <div class="lg:col-span-2 relative">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="product-search" placeholder="Search by name, SKU, or ID..." class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <!-- Category Filter -->
                    <div>
                        <select id="filter-category" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-700">
                            <option value="">All Categories</option>
                        </select>
                    </div>

                    <!-- Supplier Filter -->
                    <div>
                        <select id="filter-supplier" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-700">
                            <option value="">All Suppliers</option>
                        </select>
                    </div>

                    <!-- Stock Status Filter -->
                    <div>
                        <select id="filter-status" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-700">
                            <option value="">All Stock Statuses</option>
                            <option value="in_stock">In Stock</option>
                            <option value="low_stock">Low Stock (At/Below Min)</option>
                            <option value="out_of_stock">Out of Stock (Zero Units)</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 text-xs">
                    <!-- Sorting -->
                    <div class="flex items-center gap-2">
                        <span class="text-slate-500 font-medium">Sort by:</span>
                        <select id="sort-products" class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-md text-xs text-slate-700 focus:outline-none">
                            <option value="name-asc">Product Name (A-Z)</option>
                            <option value="name-desc">Product Name (Z-A)</option>
                            <option value="stock-asc">Stock (Lowest First)</option>
                            <option value="stock-desc">Stock (Highest First)</option>
                            <option value="price-asc">Price (Lowest First)</option>
                            <option value="price-desc">Price (Highest First)</option>
                            <option value="newest">Recently Added</option>
                        </select>
                    </div>

                    <!-- Page Size -->
                    <div class="flex items-center gap-2">
                        <span class="text-slate-500 font-medium">Show:</span>
                        <select id="page-size-select" class="px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-md text-xs text-slate-700 focus:outline-none">
                            <option value="10">10 rows</option>
                            <option value="20">20 rows</option>
                            <option value="50">50 rows</option>
                            <option value="5">5 rows</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Products Data Table -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 font-semibold text-[11px] uppercase tracking-wider border-b border-slate-200">
                                <th class="px-4 py-3">ID</th>
                                <th class="px-4 py-3">Product Name</th>
                                <th class="px-4 py-3">SKU</th>
                                <th class="px-4 py-3">Category</th>
                                <th class="px-4 py-3">Supplier</th>
                                <th class="px-4 py-3 text-right">Purchase Price</th>
                                <th class="px-4 py-3 text-right">Selling Price</th>
                                <th class="px-4 py-3 text-right">Stock</th>
                                <th class="px-4 py-3">Status</th>
                                <th class="px-4 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-slate-100">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Container -->
                <div class="px-4 py-3 border-t border-slate-200 bg-slate-50/50" id="products-pagination"></div>
            </div>

        </main>
    </div>

    <!-- MODAL: Add / Edit Product -->
    <div id="product-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-container bg-white rounded-2xl shadow-2xl max-w-xl w-full border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 id="product-modal-title" class="text-base font-bold text-slate-900">Add New Product</h3>
                <button type="button" onclick="Utils.closeModal('product-modal')" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="product-form" class="p-6 overflow-y-auto space-y-4 text-xs">
                <input type="hidden" id="product-modal-id">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-name">Product Name *</label>
                        <input type="text" id="prod-name" required placeholder="e.g. Ergonomic Office Chair" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-sku">SKU Code *</label>
                        <input type="text" id="prod-sku" required placeholder="e.g. FUR-CHR-01" class="w-full px-3 py-2 text-xs font-mono border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 uppercase">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-unit">Unit of Measure</label>
                        <input type="text" id="prod-unit" placeholder="Pcs, Box, Kg, Set" value="Pcs" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-category">Category *</label>
                        <select id="prod-category" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-supplier">Primary Supplier</label>
                        <select id="prod-supplier" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-purchase-price">Purchase / Cost Price *</label>
                        <input type="number" step="0.01" min="0" id="prod-purchase-price" required placeholder="0.00" class="w-full px-3 py-2 text-xs font-mono border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-selling-price">Selling Price *</label>
                        <input type="number" step="0.01" min="0" id="prod-selling-price" required placeholder="0.00" class="w-full px-3 py-2 text-xs font-mono border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div id="prod-stock-wrapper">
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-stock">Current Stock Quantity *</label>
                        <input type="number" min="0" id="prod-stock" value="0" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-min-stock">Min Safety Reorder Level *</label>
                        <input type="number" min="0" id="prod-min-stock" value="5" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block font-semibold text-slate-700 mb-1" for="prod-description">Product Description</label>
                        <textarea id="prod-description" rows="2" placeholder="Specifications, warranty, attributes..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"></textarea>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-3">
                    <button type="button" onclick="Utils.closeModal('product-modal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">
                        Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: View Product Details -->
    <div id="view-product-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-container bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 class="text-base font-bold text-slate-900">Product Specification Details</h3>
                <button type="button" onclick="Utils.closeModal('view-product-modal')" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto" id="view-product-content">
                <!-- Injected dynamically -->
            </div>
            <div class="px-6 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
                <button type="button" onclick="Utils.closeModal('view-product-modal')" class="px-4 py-2 text-xs font-semibold bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init('Product Management', ['Inventory', 'Products']);
            ProductsModule.init();
        });
    </script>
</body>
</html>
